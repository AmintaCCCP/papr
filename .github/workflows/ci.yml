name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Type-check & build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Run tests (vitest)
        run: pnpm test

  rust:
    name: Check Rust (src-tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # rust-cache resolves the target dir as `<workspace>/target`; the Cargo
      # workspace root is the repo root (./Cargo.toml), so pass "." — passing
      # `src-tauri` caches a directory cargo never writes to.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
