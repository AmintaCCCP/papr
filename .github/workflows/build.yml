name: Build

# Desktop packaging: builds the Tauri bundles (dmg/app, msi/nsis, AppImage/
# deb) for every platform and uploads them as workflow artifacts. No release
# is created — every push to any branch gets a compiled client per target,
# and the workflow can still be dispatched manually to package a subset of
# platforms or to grab an installable build of a specific branch.

on:
  # Every commit, on every branch (`**` covers branch names with slashes).
  # Tag pushes are excluded — the Release workflow owns those.
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which desktop targets to package
        type: choice
        default: all
        options:
          - all
          - macos
          - linux
          - windows

# A second push to the same branch while its build is still running cancels
# the older one — four runner legs of cargo compilation only to be superseded
# seconds later is pure waste.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the picker into the matrix legs. Kept as its own job because the
  # selection must happen before matrix expansion; the leg list mirrors the
  # Release workflow's build targets.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        # Via env, not inline interpolation, so no value from the dispatch
        # payload can break out into shell syntax.
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          all='[
            {"platform":"macos-latest","target":"aarch64-apple-darwin"},
            {"platform":"macos-latest","target":"x86_64-apple-darwin"},
            {"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},
            {"platform":"windows-latest","target":"x86_64-pc-windows-msvc"}
          ]'
          case "$PLATFORMS" in
            macos)
              matrix=$(echo "$all" | jq -c '[.[] | select(.platform | startswith("macos"))]')
              ;;
            linux)
              matrix='[{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]'
              ;;
            windows)
              matrix='[{"platform":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
              ;;
            # Push events carry no input at all — same as picking "all".
            all | "")
              matrix=$all
              ;;
            *)
              echo "::error::unknown platform selection: $PLATFORMS"
              exit 1
              ;;
          esac
          # Job outputs are single-line only — compact whichever branch above
          # produced the matrix (the pretty-printed `all` literal spans lines).
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri's CLI treats empty-but-set signing env vars as "provided":
      # an empty APPLE_CERTIFICATE makes it run `security import` on nothing
      # (macOS bundle fails), and an empty TAURI_SIGNING_PRIVATE_KEY breaks
      # updater-artifact signing (every platform fails). So instead of
      # mapping secrets straight into env, export them via GITHUB_ENV only
      # when actually configured, and drop updater artifacts when the
      # signing key is absent so test builds can complete ad-hoc.
      - name: Resolve signing environment
        shell: bash
        env:
          IN_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_SIGNING_KEY_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          IN_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          IN_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          IN_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Multi-line values (the minisign key, the base64 p12) go through
          # the heredoc form of GITHUB_ENV.
          export_value() {
            echo "$2<<__SECRET_EOF__" >> "$GITHUB_ENV"
            printf '%s\n' "$1" >> "$GITHUB_ENV"
            echo "__SECRET_EOF__" >> "$GITHUB_ENV"
          }

          if [ -n "$IN_SIGNING_KEY" ]; then
            export_value "$IN_SIGNING_KEY" TAURI_SIGNING_PRIVATE_KEY
            export_value "$IN_SIGNING_KEY_PW" TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          else
            # No updater key configured — disable createUpdaterArtifacts so
            # the build still completes; bundles stay unsigned for the updater.
            echo 'EXTRA_BUILD_ARGS=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

          # The whole Apple signing/notarization set only matters when a
          # certificate exists; notarization never runs on ad-hoc builds.
          if [ -n "$IN_CERT" ]; then
            export_value "$IN_CERT" APPLE_CERTIFICATE
            export_value "$IN_CERT_PW" APPLE_CERTIFICATE_PASSWORD
            export_value "$IN_IDENTITY" APPLE_SIGNING_IDENTITY
            export_value "$IN_KEYCHAIN_PW" KEYCHAIN_PASSWORD
            export_value "$IN_APPLE_ID" APPLE_ID
            export_value "$IN_APPLE_PW" APPLE_PASSWORD
            export_value "$IN_TEAM" APPLE_TEAM_ID
          fi

      # No tagName / releaseName — tauri-action builds the bundles and stops
      # there; no GitHub release is created or touched. When the updater key
      # is configured, test builds sign exactly like release builds do.
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ (matrix.platform == 'macos-latest' && format('--target {0} ', matrix.target) || '') }}${{ env.EXTRA_BUILD_ARGS }}

      # upload-artifact can't consume tauri-action's artifactPaths output —
      # it is a JSON-array string, which v4 treats as one literal glob and
      # finds nothing. Glob the bundle outputs directly instead; cargo puts
      # them under the root target dir on every platform, with cross-target
      # mac builds adding the triple as an extra path segment.
      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: papr-desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.platform == 'macos-latest' && format('{0}/', matrix.target) || '' }}release/bundle/**
          if-no-files-found: error
