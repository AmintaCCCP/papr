name: Build

# Desktop packaging: builds the Tauri bundles (dmg/app, msi/nsis, AppImage/
# deb) for every platform and uploads them as workflow artifacts. No release
# is created — every code push to any branch gets a compiled client per target,
# and the workflow can still be dispatched manually to package a subset of
# platforms or to grab an installable build of a specific branch.
#
# The web frontend (tsc + vite) is built once in `frontend` and shared as the
# `frontend-dist` artifact; every platform leg downloads it instead of running
# `pnpm build` again. The legs only run cargo/tauri.

on:
  # Every code commit, on every branch (`**` covers branch names with slashes).
  # Tag pushes are excluded — the Release workflow owns those. Docs-only pushes
  # skip the build entirely: nothing in dist/bundles depends on them, and each
  # pushed leg is another chance to lose a hosted macOS runner (see retry.yml).
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      platforms:
        description: Which desktop targets to package
        type: choice
        default: all
        options:
          - all
          - macos
          - linux
          - windows

# A second push to the same branch while its build is still running cancels
# the older one — four runner legs of cargo compilation only to be superseded
# seconds later is pure waste.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One frontend build for all platform legs. Kept separate so the dist artifact
  # is produced exactly once per run instead of once per leg.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (tsc + vite)
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          # A failed platform leg can be re-run manually for up to 30 days;
          # keep dist around for that whole window so the re-run still has it.
          retention-days: 30

  # Resolve the picker into the matrix legs. Kept as its own job because the
  # selection must happen before matrix expansion; the leg list mirrors the
  # Release workflow's build targets. macOS is one leg per arch on the newest
  # image: arm64 on macos-26, x64 on macos-26-intel (native builds, no
  # cross-compile, separate rust-cache keys). The mac legs go to their own job
  # below so arm64 can run before x64.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - id: pick
        # Via env, not inline interpolation, so no value from the dispatch
        # payload can break out into shell syntax.
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          mac='[
            {"platform":"macos-26","target":"aarch64-apple-darwin"},
            {"platform":"macos-26-intel","target":"x86_64-apple-darwin"}
          ]'
          linux='{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}'
          windows='{"platform":"windows-latest","target":"x86_64-pc-windows-msvc"}'
          case "$PLATFORMS" in
            macos)
              non_mac='[]'
              macos=$mac
              ;;
            linux)
              non_mac="[$linux]"
              macos='[]'
              ;;
            windows)
              non_mac="[$windows]"
              macos='[]'
              ;;
            # Push events carry no input at all — same as picking "all".
            all | "")
              non_mac="[$linux,$windows]"
              macos=$mac
              ;;
            *)
              echo "::error::unknown platform selection: $PLATFORMS"
              exit 1
              ;;
          esac
          # Job outputs are single-line only — compact whichever branch above
          # produced the matrices (the pretty-printed literals span lines).
          echo "matrix=$(echo "$non_mac" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "macos=$(echo "$macos" | jq -c .)" >> "$GITHUB_OUTPUT"

  # Linux + Windows legs. Independent of the mac queue, so they run in
  # parallel while the mac legs take turns below.
  build:
    needs: [plan, frontend]
    # An empty picker result expands to zero legs; skip instead of erroring.
    if: needs.plan.outputs.matrix != '[]'
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps: &desktop-steps
      - uses: actions/checkout@v5

      # tauri.conf.json's frontendDist is ../dist, i.e. the repo-root dist this
      # artifact unpacks to. The build below disables beforeBuildCommand so the
      # vendored dist is what gets bundled.
      - name: Download frontend dist
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: dist

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && matrix.target || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # tauri-action shells out to `pnpm tauri build`, so node_modules must
      # exist even though the frontend is not rebuilt here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri's CLI treats empty-but-set signing env vars as "provided":
      # an empty APPLE_CERTIFICATE makes it run `security import` on nothing
      # (macOS bundle fails), and an empty TAURI_SIGNING_PRIVATE_KEY breaks
      # updater-artifact signing (every platform fails). So instead of
      # mapping secrets straight into env, export them via GITHUB_ENV only
      # when actually configured, and drop updater artifacts when the
      # signing key is absent so test builds can complete ad-hoc.
      - name: Resolve signing environment
        shell: bash
        env:
          IN_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_SIGNING_KEY_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          IN_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          IN_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          IN_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Multi-line values (the minisign key, the base64 p12) go through
          # the heredoc form of GITHUB_ENV.
          export_value() {
            {
              echo "$2<<__SECRET_EOF__"
              printf '%s\n' "$1"
              echo "__SECRET_EOF__"
            } >> "$GITHUB_ENV"
          }

          if [ -n "$IN_SIGNING_KEY" ]; then
            export_value "$IN_SIGNING_KEY" TAURI_SIGNING_PRIVATE_KEY
            export_value "$IN_SIGNING_KEY_PW" TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          else
            # No updater key configured — disable createUpdaterArtifacts so
            # the build still completes; bundles stay unsigned for the updater.
            echo 'EXTRA_BUILD_ARGS=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

          # The whole Apple signing/notarization set only matters when a
          # certificate exists; notarization never runs on ad-hoc builds.
          if [ -n "$IN_CERT" ]; then
            export_value "$IN_CERT" APPLE_CERTIFICATE
            export_value "$IN_CERT_PW" APPLE_CERTIFICATE_PASSWORD
            export_value "$IN_IDENTITY" APPLE_SIGNING_IDENTITY
            export_value "$IN_KEYCHAIN_PW" KEYCHAIN_PASSWORD
            export_value "$IN_APPLE_ID" APPLE_ID
            export_value "$IN_APPLE_PW" APPLE_PASSWORD
            export_value "$IN_TEAM" APPLE_TEAM_ID
          fi

      # No tagName / releaseName — tauri-action builds the bundles and stops
      # there; no GitHub release is created or touched. When the updater key
      # is configured, test builds sign exactly like release builds do.
      # `beforeBuildCommand: ""` keeps the pre-built dist: without it every
      # leg would re-run `pnpm build` and defeat the shared artifact.
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tauri-action runs `args` through string-argv, so the JSON is quoted
          # as one shell-style argument: whatever the tokenizer does with bare
          # quotes, the config never splits or loses its inner quotes.
          args: >-
            ${{ startsWith(matrix.platform, 'macos') && format('--target {0}', matrix.target) || '' }}
            --config '{"build":{"beforeBuildCommand":""}}' ${{ env.EXTRA_BUILD_ARGS }}

      # upload-artifact can't consume tauri-action's artifactPaths output —
      # it is a JSON-array string, which v4 treats as one literal glob and
      # finds nothing. Glob the bundle outputs directly instead; cargo puts
      # them under the root target dir on every platform, and legs that pass
      # --target (both macOS ones) add the triple as an extra path segment.
      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: papr-desktop-${{ matrix.target }}
          path: ${{ startsWith(matrix.platform, 'macos') && format('target/{0}/release/bundle/**', matrix.target) || 'target/release/bundle/**' }}
          if-no-files-found: error

  # macOS legs, arm64 first. `max-parallel: 1` makes the x64 leg wait for the
  # arm64 one instead of both competing for a scarce hosted macOS runner; arm64
  # is the architecture that matters now that Intel Macs are being phased out.
  # Steps are shared with `build` above via the YAML anchor, so the two jobs
  # cannot drift apart.
  build-macos:
    needs: [plan, frontend]
    if: needs.plan.outputs.macos != '[]'
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    runs-on: ${{ matrix.platform }}
    steps: *desktop-steps
