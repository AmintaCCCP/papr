name: Retry runner-cancelled runs

# GitHub-hosted macOS runners regularly never get acquired: the job sits in
# the queue, runs zero steps, and is marked `cancelled` at exactly 15 minutes.
# That turns a green build red without a line of code being wrong (see
# actions/runner#4833). This workflow re-runs the failed jobs once when such a
# zero-step cancellation is what took the run down. Genuine compile failures
# never have a cancelled job, so they are left alone. `run_attempt < 2` caps
# this at a single automatic retry, so a retried run can never loop.

on:
  workflow_run:
    workflows: ["Build", "Release"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-cancelled:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed jobs when a runner was never acquired
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          cancelled=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "cancelled")] | length')
          if [ "$cancelled" -eq 0 ]; then
            echo "no cancelled jobs — real failure, not a runner acquisition loss"
            exit 0
          fi
          echo "::notice::$cancelled job(s) cancelled without running; retrying failed jobs once"
          gh run rerun "$RUN_ID" --repo "$REPO" --failed \
            || gh run rerun "$RUN_ID" --repo "$REPO"