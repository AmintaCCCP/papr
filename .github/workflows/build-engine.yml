name: Engine build

# Builds the bundled local RSSHub engine for every supported desktop
# platform. Runs on demand and weekly (RSSHub moves fast; a stale engine
# misses route fixes). Artifacts are attached to this run and, best-effort,
# uploaded to the `engine` prerelease for the settings card's URL installer.
on:
  workflow_dispatch:
  schedule:
    # Mondays 03:40 UTC — off the busy top-of-hour slots.
    - cron: "40 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            # macos-14 was retired on 2026-11-02; the macos-15 image is arm64.
            runner: macos-15
            flavor: standard
          - platform: darwin-arm64
            runner: macos-15
            flavor: browser
          - platform: linux-x64
            runner: ubuntu-latest
            flavor: standard
          - platform: linux-x64
            runner: ubuntu-latest
            flavor: browser
          - platform: win-x64
            runner: windows-latest
            flavor: standard
          - platform: win-x64
            runner: windows-latest
            flavor: browser
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # RSSHub master requires node ^24.15.
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        # The version comes from RSSHub's packageManager field after the
        # clone; pin a compatible one here so install is deterministic.
        with:
          version: 12

      # The build caches (RSSHub clone, pnpm store, Node distribution) live
      # under target/engine-cache keyed by a rolling ISO week — cheap
      # rebuilds, no unbounded growth. The exact key only matches within one
      # week, so the cache is saved once per week per platform instead of on
      # every run; the restore-keys prefix still picks up the previous week's
      # cache for a fresh build.
      - name: Compute cache key (ISO week)
        shell: bash
        run: echo "ENGINE_WEEK=$(date +%G-W%V)" >> "$GITHUB_ENV"

      - name: Restore engine build cache
        uses: actions/cache@v5
        with:
          path: target/engine-cache
          key: engine-cache-${{ matrix.platform }}-${{ env.ENGINE_WEEK }}
          restore-keys: engine-cache-${{ matrix.platform }}-

      - name: Build engine
        shell: bash
        run: |
          if [ "${{ matrix.flavor }}" = "browser" ]; then
            scripts/build-engine.sh --browser
          else
            scripts/build-engine.sh
          fi

      - name: Upload run artifact
        uses: actions/upload-artifact@v6
        with:
          name: rsshub-engine-${{ matrix.flavor }}-${{ matrix.platform }}
          path: |
            target/engine/*.tar.gz
            target/engine/*.sha256
          if-no-files-found: error

  release:
    # Best-effort: attach the archives to the rolling `engine` prerelease so
    # the settings card's URL installer has stable links. A missing release
    # or a token without push rights must not fail the build.
    name: Attach to engine prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the engine prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view engine --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create engine --repo "$GITHUB_REPOSITORY" \
              --title "RSSHub engine builds" \
              --notes "Rolling prerelease of papr's bundled local RSSHub engine archives. Checksums in the .sha256 files." \
              --prerelease
          gh release upload engine dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
