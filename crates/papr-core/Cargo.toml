[package]
name = "papr-core"
version = "0.16.1"
edition = "2021"
description = "Papr's UI-free core: SQLite data layer, feed ingestion, and content sanitization. Shared by the desktop app and the agent CLI."

[lib]
name = "papr_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
feed-rs.workspace = true
reqwest.workspace = true
tokio.workspace = true
log.workspace = true
scraper.workspace = true
ego-tree.workspace = true
url.workspace = true
opml.workspace = true
encoding_rs.workspace = true
imap.workspace = true
mail-parser.workspace = true
ammonia.workspace = true
dom_smoothie.workspace = true
lol_html.workspace = true
chrono.workspace = true
rand.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# RSSHub route marketplace: engine archive install/extract/integrity.
# tar+flate2 for .tar.gz, zip for .zip, sha2 for the optional checksum the
# marketplace verifies a downloaded archive against. Small, maintained crates
# only — no browser automation or heavy runtimes are pulled in.
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

# Unix only: `sysconf(_SC_ARG_MAX)` sizes the engine child's environment
# budget to what execve on this kernel actually accepts (RLIMIT_STACK can
# push it far below any fixed ceiling on Linux).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
